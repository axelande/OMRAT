<rect width="900" height="828" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" font-style="normal" fill="#1a1a2e">Ship-ship collision types in OMRAT</text>
<text x="450" y="64" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#455A64">Along a leg (Hansen 2008)</text>
<rect x="20" y="75" width="420" height="270" rx="10" fill="#e3f2fd" stroke="#1976D2" stroke-width="2"/>
<text x="230" y="99" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#0D47A1">Head-on</text>
<rect x="60" y="115" width="340" height="78" fill="#ffffff" stroke="#90A4AE" stroke-dasharray="5 3"/>
<text x="66" y="128" text-anchor="start" font-size="9" font-weight="normal" font-style="italic" fill="#78909C">leg</text>
<polyline points="90,139 270,139" fill="none" stroke="#1976D2" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="180" y="133" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1565C0">direction 1 (Q<tspan dy="3.0" font-size="7.5">1</tspan><tspan dy="-3.0">​</tspan>, V<tspan dy="3.0" font-size="7.5">1</tspan><tspan dy="-3.0">​</tspan>)</text>
<polyline points="370,171 190,171" fill="none" stroke="#D32F2F" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)"/>
<text x="280" y="186" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#C62828">direction 2 (Q<tspan dy="3.0" font-size="7.5">2</tspan><tspan dy="-3.0">​</tspan>, V<tspan dy="3.0" font-size="7.5">2</tspan><tspan dy="-3.0">​</tspan>)</text>
<text x="230" y="213" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#263238">Opposite directions on the same leg</text>
<text x="230" y="237" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#0D47A1">V<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan> = V<tspan dy="3.3" font-size="8.2">1</tspan><tspan dy="-3.3">​</tspan> + V<tspan dy="3.3" font-size="8.2">2</tspan><tspan dy="-3.3">​</tspan></text>
<text x="230" y="256" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238">P<tspan dy="3.3" font-size="8.2">G</tspan><tspan dy="-3.3">​</tspan> = Σ<tspan dy="3.3" font-size="8.2">k</tspan><tspan dy="-3.3">​</tspan> Σ<tspan dy="3.3" font-size="8.2">l</tspan><tspan dy="-3.3">​</tspan> w<tspan dy="3.3" font-size="8.2">k</tspan><tspan dy="-3.3">​</tspan> w<tspan dy="3.3" font-size="8.2">l</tspan><tspan dy="-3.3">​</tspan> P<tspan dy="3.3" font-size="8.2">G</tspan><tspan dy="-3.3">​</tspan>(k, l)  over the lateral mixture components</text>
<text x="230" y="275" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238">P<tspan dy="3.3" font-size="8.2">G</tspan><tspan dy="-3.3">​</tspan>(k, l) = Φ((Δμ + B)/σ) − Φ((Δμ − B)/σ)</text>
<text x="230" y="294" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238">Δμ = μ<tspan dy="3.3" font-size="8.2">k</tspan><tspan dy="-3.3">​</tspan> − μ<tspan dy="3.3" font-size="8.2">l</tspan><tspan dy="-3.3">​</tspan>,  σ = √(σ<tspan dy="3.3" font-size="8.2">k</tspan><tspan dy="-3.3">​</tspan><tspan dy="-4.4" font-size="8.2">2</tspan><tspan dy="4.4">​</tspan> + σ<tspan dy="3.3" font-size="8.2">l</tspan><tspan dy="-3.3">​</tspan><tspan dy="-4.4" font-size="8.2">2</tspan><tspan dy="4.4">​</tspan>),  B = (B<tspan dy="3.3" font-size="8.2">1</tspan><tspan dy="-3.3">​</tspan> + B<tspan dy="3.3" font-size="8.2">2</tspan><tspan dy="-3.3">​</tspan>)/2</text>
<text x="230" y="313" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#0D47A1">N<tspan dy="3.3" font-size="8.2">G</tspan><tspan dy="-3.3">​</tspan> = (Q<tspan dy="3.3" font-size="8.2">1</tspan><tspan dy="-3.3">​</tspan>/V<tspan dy="3.3" font-size="8.2">1</tspan><tspan dy="-3.3">​</tspan>) (Q<tspan dy="3.3" font-size="8.2">2</tspan><tspan dy="-3.3">​</tspan>/V<tspan dy="3.3" font-size="8.2">2</tspan><tspan dy="-3.3">​</tspan>) V<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan> P<tspan dy="3.3" font-size="8.2">G</tspan><tspan dy="-3.3">​</tspan> L<tspan dy="3.3" font-size="8.2">w</tspan><tspan dy="-3.3">​</tspan></text>
<rect x="460" y="75" width="420" height="270" rx="10" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
<text x="670" y="99" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#2E7D32">Overtaking</text>
<rect x="500" y="115" width="340" height="78" fill="#ffffff" stroke="#90A4AE" stroke-dasharray="5 3"/>
<text x="506" y="128" text-anchor="start" font-size="9" font-weight="normal" font-style="italic" fill="#78909C">leg</text>
<polyline points="530,141 760,141" fill="none" stroke="#1976D2" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="645" y="135" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1565C0">fast ship (Q<tspan dy="3.0" font-size="7.5">f</tspan><tspan dy="-3.0">​</tspan>, V<tspan dy="3.0" font-size="7.5">f</tspan><tspan dy="-3.0">​</tspan>)</text>
<polyline points="550,169 690,169" fill="none" stroke="#D32F2F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/>
<text x="620" y="185" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#C62828">slow ship (Q<tspan dy="3.0" font-size="7.5">s</tspan><tspan dy="-3.0">​</tspan>, V<tspan dy="3.0" font-size="7.5">s</tspan><tspan dy="-3.0">​</tspan>)</text>
<text x="670" y="213" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#263238">Same direction, different speeds</text>
<text x="670" y="237" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#2E7D32">V<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan> = V<tspan dy="3.3" font-size="8.2">f</tspan><tspan dy="-3.3">​</tspan> − V<tspan dy="3.3" font-size="8.2">s</tspan><tspan dy="-3.3">​</tspan>   (no candidates unless V<tspan dy="3.3" font-size="8.2">f</tspan><tspan dy="-3.3">​</tspan> &gt; V<tspan dy="3.3" font-size="8.2">s</tspan><tspan dy="-3.3">​</tspan>)</text>
<text x="670" y="256" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238">Both ships drawn from the same direction’s mixture,</text>
<text x="670" y="275" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238">P<tspan dy="3.3" font-size="8.2">G</tspan><tspan dy="-3.3">​</tspan> summed over the component pairs as for head-on</text>
<text x="670" y="294" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238"></text>
<text x="670" y="313" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#2E7D32">N<tspan dy="3.3" font-size="8.2">G</tspan><tspan dy="-3.3">​</tspan> = (Q<tspan dy="3.3" font-size="8.2">f</tspan><tspan dy="-3.3">​</tspan>/V<tspan dy="3.3" font-size="8.2">f</tspan><tspan dy="-3.3">​</tspan>) (Q<tspan dy="3.3" font-size="8.2">s</tspan><tspan dy="-3.3">​</tspan>/V<tspan dy="3.3" font-size="8.2">s</tspan><tspan dy="-3.3">​</tspan>) V<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan> P<tspan dy="3.3" font-size="8.2">G</tspan><tspan dy="-3.3">​</tspan> L<tspan dy="3.3" font-size="8.2">w</tspan><tspan dy="-3.3">​</tspan></text>
<text x="450" y="374" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#455A64">At a shared waypoint, per pair of routes (in-leg → out-leg, shares from the junction matrix)</text>
<rect x="20" y="385" width="280" height="240" rx="10" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
<text x="160" y="409" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#E65100">Crossing</text>
<polyline points="50,497 265,497" fill="none" stroke="#1976D2" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="105,567 212,431" fill="none" stroke="#D32F2F" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)"/>
<path d="M 190.0,497.0 A 30,30 0 0,0 178.6,473.4" fill="none" stroke="#E65100" stroke-width="1.5"/>
<text x="196" y="485" text-anchor="start" font-size="13" font-weight="bold" font-style="normal" fill="#E65100">θ</text>
<circle cx="160" cy="497" r="5.5" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="90" y="489" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1565C0">route 1</text>
<text x="110" y="559" text-anchor="end" font-size="10" font-weight="normal" font-style="normal" fill="#C62828">route 2</text>
<text x="160" y="585" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#263238">Two routes over four legs</text>
<text x="160" y="602" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#263238">whose paths cross at the waypoint</text>
<rect x="310" y="385" width="280" height="240" rx="10" fill="#fffde7" stroke="#F9A825" stroke-width="2"/>
<text x="450" y="409" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#8D6E00">Merging</text>
<polyline points="345,445 460,494 565,494" fill="none" stroke="#1976D2" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="345,549 460,500 565,500" fill="none" stroke="#D32F2F" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)"/>
<path d="M 429.0,483.0 A 34,34 0 0,0 429.0,511.0" fill="none" stroke="#8D6E00" stroke-width="1.5"/>
<text x="420" y="502" text-anchor="end" font-size="13" font-weight="bold" font-style="normal" fill="#8D6E00">θ</text>
<circle cx="460" cy="497" r="5.5" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="365" y="445" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#1565C0">route 1</text>
<text x="365" y="563" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#C62828">route 2</text>
<text x="515" y="485" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#5D4037">same out-leg</text>
<text x="450" y="585" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#263238">Two routes from different legs</text>
<text x="450" y="602" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#263238">leaving on the same leg</text>
<rect x="600" y="385" width="280" height="240" rx="10" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2"/>
<text x="740" y="409" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#6A1B9A">Bend</text>
<polyline points="728,505 860,505" fill="none" stroke="#1976D2" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#blue)"/>
<text x="860" y="521" text-anchor="end" font-size="10" font-weight="normal" font-style="normal" fill="#1565C0">does not turn</text>
<polyline points="620,502 720,502 831,422" fill="none" stroke="#1976D2" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="839,430 723,509 620,509" fill="none" stroke="#D32F2F" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)"/>
<path d="M 754.0,505.0 A 34,34 0 0,0 747.9,485.6" fill="none" stroke="#6A1B9A" stroke-width="1.5"/>
<text x="760" y="497" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#6A1B9A">turn</text>
<circle cx="720" cy="505" r="5.5" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="660" y="495" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1565C0">A → B</text>
<text x="660" y="525" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#C62828">B → A</text>
<text x="740" y="585" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#263238">The two reverse routes of one turn,</text>
<text x="740" y="602" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#263238">every ship of both, at θ = 180° − turn</text>
<rect x="20" y="638" width="860" height="150" rx="10" fill="#fafafa" stroke="#9E9E9E" stroke-width="1.5"/>
<text x="450" y="662" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#37474F">One formula for crossing, merging and bend (Pedersen 1995), per pair of routes and pair of ship cells i, j</text>
<text x="450" y="688" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#37474F">N<tspan dy="3.3" font-size="8.2">G</tspan><tspan dy="-3.3">​</tspan> = Σ<tspan dy="3.3" font-size="8.2">i,j</tspan><tspan dy="-3.3">​</tspan> (Q<tspan dy="3.3" font-size="8.2">i</tspan><tspan dy="-3.3">​</tspan> T<tspan dy="3.3" font-size="8.2">1</tspan><tspan dy="-3.3">​</tspan> / V<tspan dy="3.3" font-size="8.2">i</tspan><tspan dy="-3.3">​</tspan>) (Q<tspan dy="3.3" font-size="8.2">j</tspan><tspan dy="-3.3">​</tspan> T<tspan dy="3.3" font-size="8.2">2</tspan><tspan dy="-3.3">​</tspan> / V<tspan dy="3.3" font-size="8.2">j</tspan><tspan dy="-3.3">​</tspan>) V<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan> D<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan> / |sin θ|</text>
<text x="450" y="709" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238">V<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan> = √(V<tspan dy="3.3" font-size="8.2">i</tspan><tspan dy="-3.3">​</tspan><tspan dy="-4.4" font-size="8.2">2</tspan><tspan dy="4.4">​</tspan> + V<tspan dy="3.3" font-size="8.2">j</tspan><tspan dy="-3.3">​</tspan><tspan dy="-4.4" font-size="8.2">2</tspan><tspan dy="4.4">​</tspan> − 2 V<tspan dy="3.3" font-size="8.2">i</tspan><tspan dy="-3.3">​</tspan> V<tspan dy="3.3" font-size="8.2">j</tspan><tspan dy="-3.3">​</tspan> cos θ)</text>
<text x="450" y="730" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238">D<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan> = (L<tspan dy="3.3" font-size="8.2">i</tspan><tspan dy="-3.3">​</tspan> V<tspan dy="3.3" font-size="8.2">j</tspan><tspan dy="-3.3">​</tspan> + L<tspan dy="3.3" font-size="8.2">j</tspan><tspan dy="-3.3">​</tspan> V<tspan dy="3.3" font-size="8.2">i</tspan><tspan dy="-3.3">​</tspan>) |sin θ| / V<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan>  +  B<tspan dy="3.3" font-size="8.2">i</tspan><tspan dy="-3.3">​</tspan> √(1 − (V<tspan dy="3.3" font-size="8.2">j</tspan><tspan dy="-3.3">​</tspan> sin θ / V<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan>)<tspan dy="-4.4" font-size="8.2">2</tspan><tspan dy="4.4">​</tspan>)  +  B<tspan dy="3.3" font-size="8.2">j</tspan><tspan dy="-3.3">​</tspan> √(1 − (V<tspan dy="3.3" font-size="8.2">i</tspan><tspan dy="-3.3">​</tspan> sin θ / V<tspan dy="3.3" font-size="8.2">ij</tspan><tspan dy="-3.3">​</tspan>)<tspan dy="-4.4" font-size="8.2">2</tspan><tspan dy="4.4">​</tspan>)</text>
<text x="450" y="751" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238">T<tspan dy="3.3" font-size="8.2">1</tspan><tspan dy="-3.3">​</tspan>, T<tspan dy="3.3" font-size="8.2">2</tspan><tspan dy="-3.3">​</tspan> = the routes’ junction-matrix shares;  θ = angle between the arrival courses;  speeds at the waypoint;  L = length-class midpoint</text>
<text x="450" y="772" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#263238">Route pairs within the angle limit (default 10°) of parallel or opposite are skipped</text>
<rect x="20" y="798" width="860" height="24" rx="5" fill="#efebe9" stroke="#795548"/>
<text x="450" y="814" text-anchor="middle" font-size="10.5" font-weight="normal" font-style="normal" fill="#4E342E">Accident frequency = N<tspan dy="3.1" font-size="7.9">G</tspan><tspan dy="-3.1">​</tspan> × P<tspan dy="3.1" font-size="7.9">C</tspan><tspan dy="-3.1">​</tspan>.   Default P<tspan dy="3.1" font-size="7.9">C</tspan><tspan dy="-3.1">​</tspan> (IWRAP): head-on 4.9e-5, overtaking 1.1e-4, crossing / merging / bend 1.3e-4;  ÷√F per passenger ship or fast ferry</text>
</svg>
