[pytest]
markers =
    slow: integration tests that run the full drifting cascade (seconds to minutes).
          Skipped by default.  Run with: pytest -m slow
addopts = -m "not slow"
# pytest-qgis: Qt's "offscreen" platform, so the 300+ tests that open the
# OMRAT window draw nothing on the screen (and run ~35 % faster).  To watch
# them, or for the tests that need real Windows windows (title bar, native
# mouse wheel -- tools/run_all_checks.py runs those in a step of their own):
#     pytest -o qgis_gui_enabled=true tests/test_dock_window_frame.py
qgis_gui_enabled = false
# The standalone runs (-p no:qgis --noconftest) do not load pytest-qgis,
# which is what declares that option.
filterwarnings =
    ignore:Unknown config option. qgis_gui_enabled:pytest.PytestConfigWarning
